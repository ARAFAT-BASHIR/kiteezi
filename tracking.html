<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Track Orders & Bookings | Kiteezi Recreational Center</title><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"><style>
.track-wrap{padding:55px 0 80px}.track-card{max-width:980px;margin:auto}.track-search{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:24px}.track-search input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d7ddd8;border-radius:10px;font:inherit}.order-card{border:1px solid #e1e7e2;border-radius:16px;padding:20px;margin:14px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-id{font-weight:800;color:#1b4332}.status-pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf4ef;font-weight:800}.station-list{display:grid;gap:8px;margin-top:14px}.station-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f9f7;border-radius:10px}.cancel-btn{margin-top:16px}.error{color:#8b2222}.muted{color:#65746b}.empty{padding:25px;text-align:center;background:#fff;border:1px solid #e1e7e2;border-radius:16px}@media(max-width:650px){.track-search{grid-template-columns:1fr}.station-row{display:block}.station-row .status-pill{margin-top:6px}}
</style></head><body>
<header class="nav"><div class="container navin"><a class="brand" href="menu.html"><span class="brand-mark">K</span><span><span class="brand-name">Kiteezi Recreational Center</span><small>Order tracking</small></span></a><nav class="links"><a href="menu.html">Menu</a><a href="booking.html">Bookings</a></nav></div></header>
<main class="track-wrap"><div class="container track-card"><div class="section-head"><div class="eyebrow">Tracking</div><h1 id="heading">Track your orders</h1><p id="intro">Enter the same phone number used when ordering or booking. Your recent status stays available here.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><button class="btn btn-light" type="button" data-mode="order">Track Orders</button><button class="btn btn-light" type="button" data-mode="booking">Track Bookings</button></div><form id="trackForm" class="track-search"><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="+256700190708 or 0700190708"><button id="trackButton" class="btn btn-dark" type="submit">Track Orders</button></form><div id="message" class="notice" hidden></div><div id="orders"></div></div></main>
<script src="config.js"></script><script>
(function(){'use strict';
const C=window.KITEEZI_CONFIG||{},URL=String(C.SUPABASE_URL||'').replace(/\/+$/,''),KEY=C.SUPABASE_ANON_KEY||'',params=new URLSearchParams(location.search);
let type=params.get('type')==='booking'?'booking':'order';
const form=document.getElementById('trackForm'),phone=document.getElementById('phone'),message=document.getElementById('message'),orders=document.getElementById('orders'),heading=document.getElementById('heading'),intro=document.getElementById('intro'),trackButton=document.getElementById('trackButton');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const humanTrackingError=(error,fallback='We could not load your status right now. Please try again in a moment.')=>{const m=String(error?.message??error??'').trim();if(!m||m==='[object Object]')return fallback;if(/(?:supabase|postgrest|pgrst|postgres|sql|schema|relation|column|constraint|permission denied|function .* does not exist|does not exist|http\s*\d{3}|\b(?:3f000|42883|42501|235\d{3})\b|fetch failed|network error|unexpected .* response|syntax error|jwt)/i.test(m)||/^\s*[\[{].*[\]}]\s*$/.test(m))return fallback;return m;};
const rpc=async(name,body)=>{const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=null}if(!r.ok)throw Error(humanTrackingError(d?.message||d?.error||d));return d;};
const orderLabel=s=>({pending:'Waiting for Confirmation',open:'Waiting for Confirmation',confirmed:'In Progress',completed:'Complete',cancelled:'Cancelled'}[String(s||'').toLowerCase()]||String(s||''));
const stationLabel=s=>({waiting:'Waiting',in_progress:'In Progress',complete:'Complete',cancelled:'Cancelled'}[String(s||'').toLowerCase()]||String(s||''));
function renderOrders(rows){if(!rows.length){orders.innerHTML='<div class="empty">No website orders were found for this phone number.</div>';return;}orders.innerHTML=rows.map(r=>{const st=Array.isArray(r.station_progress)?r.station_progress:[],can=['pending','open','confirmed'].includes(String(r.status||'').toLowerCase());const sh=st.length?'<div class="station-list">'+st.map(x=>'<div class="station-row"><span>'+esc(x.station_name)+'</span><span class="status-pill">'+esc(stationLabel(x.status))+'</span></div>').join('')+'</div>':'<p class="muted">'+(String(r.status).toLowerCase()==='cancelled'?'—':'Waiting')+'</p>';return '<article class="order-card"><div class="order-head"><span class="order-id">#KD-'+esc(String(r.order_id).slice(0,8).toUpperCase())+'</span><span class="status-pill">'+esc(orderLabel(r.status))+'</span></div><div class="muted" style="margin-top:7px">'+esc(new Date(r.created_at).toLocaleString())+'</div>'+sh+(can?'<button class="btn cancel-btn" type="button" data-cancel-order="'+esc(r.order_id)+'">Cancel Order</button>':'')+'</article>';}).join('');}
function renderBooking(row){if(!row){orders.innerHTML='<div class="empty">No matching booking was found for this phone number.</div>';return;}const can=['pending','confirmed'].includes(String(row.status||'').toLowerCase());orders.innerHTML='<article class="order-card"><div class="order-head"><span class="order-id">Booking #'+esc(String(row.booking_id).slice(0,8).toUpperCase())+'</span><span class="status-pill">'+esc(orderLabel(row.status))+'</span></div><div class="station-list"><div class="station-row"><span>Date</span><span>'+esc(row.booking_date||'—')+'</span></div><div class="station-row"><span>Time</span><span>'+esc(String(row.start_time||'').slice(0,5)||'—')+'</span></div></div>'+(can?'<button class="btn cancel-btn" type="button" data-cancel-booking="'+esc(row.booking_id)+'">Cancel Booking</button>':'')+'</article>';}function renderBookings(rows){if(!rows.length){orders.innerHTML='<div class="empty">No bookings were found for this phone number.</div>';return;}orders.innerHTML=rows.map(row=>{const can=['pending','confirmed'].includes(String(row.status||'').toLowerCase());return '<article class="order-card"><div class="order-head"><span class="order-id">Booking #'+esc(String(row.booking_id).slice(0,8).toUpperCase())+'</span><span class="status-pill">'+esc(orderLabel(row.status))+'</span></div><div class="station-list"><div class="station-row"><span>Service</span><span>'+esc(row.service_name||'Booking')+'</span></div><div class="station-row"><span>Date</span><span>'+esc(row.booking_date||'—')+'</span></div><div class="station-row"><span>Time</span><span>'+esc(String(row.start_time||'').slice(0,5)||'—')+'</span></div><div class="station-row"><span>Total</span><span>UGX '+esc(new Intl.NumberFormat('en-UG').format(Number(row.total)||0))+'</span></div></div>'+(row.customer_confirmation_message?'<div class="notice success" style="margin-top:12px">'+esc(row.customer_confirmation_message)+'</div>':'')+(can?'<button class="btn cancel-btn" type="button" data-cancel-booking="'+esc(row.booking_id)+'">Cancel Booking</button>':'')+'</article>';}).join('');}
function applyMode(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===type));if(type==='booking'){heading.textContent='Track your bookings';intro.textContent='Enter the same phone number used when booking. Your recent booking status stays available here.';trackButton.textContent='Track Bookings';document.title='Track Bookings | Kiteezi Recreational Center';}else{heading.textContent='Track your orders';intro.textContent='Enter the same phone number used when ordering. Your recent order status stays available here.';trackButton.textContent='Track Orders';document.title='Track Orders | Kiteezi Recreational Center';}}
async function track(){const value=phone.value.trim();if(!value)throw Error('Please enter your phone number.');message.hidden=true;orders.innerHTML='<div class="empty">Loading…</div>';if(type==='booking'){const d=await rpc('get_public_bookings_by_phone',{p_phone:value});renderBookings(Array.isArray(d)?d:(d?[d]:[]));return;}const d=await rpc('get_public_orders_by_phone',{p_phone:value});renderOrders(Array.isArray(d)?d:(d?[d]:[]));}
orders.addEventListener('click',async e=>{const ob=e.target.closest('[data-cancel-order]');const bb=e.target.closest('[data-cancel-booking]');if(!ob&&!bb)return;if(!confirm((ob?'Cancel this order?':'Cancel this booking?')+' No WhatsApp message will be sent.'))return;e.target.disabled=true;e.target.textContent='Cancelling…';try{await rpc(ob?'cancel_public_order':'cancel_public_booking',ob?{p_order_id:ob.dataset.cancelOrder,p_phone:phone.value.trim()}:{p_booking_id:bb.dataset.cancelBooking,p_phone:phone.value.trim()});await track();}catch(err){message.hidden=false;message.className='notice error';message.textContent=humanTrackingError(err,'We could not cancel this request right now. Please try again.');e.target.disabled=false;e.target.textContent=ob?'Cancel Order':'Cancel Booking';}});
form.addEventListener('submit',async e=>{e.preventDefault();try{await track();}catch(err){message.hidden=false;message.className='notice error';message.textContent=humanTrackingError(err,'We could not load your status right now. Please try again.');orders.innerHTML='';}});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{type=b.dataset.mode;history.replaceState(null,'','#tracking?type='+type);applyMode();if(phone.value.trim())track().catch(()=>{});});
phone.value='';applyMode();
})();
</script><script src="site.js"></script></body></html>
