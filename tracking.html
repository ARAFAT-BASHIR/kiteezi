<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Track Orders | Kiteezi Recreational Center</title><link rel="stylesheet" href="styles.css"><style>
.track-wrap{padding:55px 0 80px}.track-card{max-width:980px;margin:auto}.track-search{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:24px}.track-search input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d7ddd8;border-radius:10px;font:inherit}.order-card{border:1px solid #e1e7e2;border-radius:16px;padding:20px;margin:14px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-id{font-weight:800;color:#1b4332}.status-pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf4ef;font-weight:800}.station-list{display:grid;gap:8px;margin-top:14px}.station-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f9f7;border-radius:10px}.cancel-btn{margin-top:16px}.error{color:#8b2222}.muted{color:#65746b}.empty{padding:25px;text-align:center;background:#fff;border:1px solid #e1e7e2;border-radius:16px}@media(max-width:650px){.track-search{grid-template-columns:1fr}.station-row{display:block}.station-row .status-pill{margin-top:6px}}
</style></head><body>
<header class="nav"><div class="container navin"><a class="brand" href="menu.html"><span class="brand-mark">K</span><span><span class="brand-name">Kiteezi Recreational Center</span><small>Order tracking</small></span></a><nav class="links"><a href="menu.html">Menu</a></nav></div></header>
<main class="track-wrap"><div class="container track-card"><div class="section-head"><div class="eyebrow">Order tracking</div><h1>Track your orders</h1><p>Enter the same phone number used when ordering. We show your 4 most recent website orders.</p></div><form id="trackForm" class="track-search"><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="+256700190708 or 0700190708"><button class="btn btn-dark" type="submit">Track Orders</button></form><div id="message" class="notice" hidden></div><div id="orders"></div></div></main>
<script src="config.js"></script><script>
(function(){'use strict';
const C=window.KITEEZI_CONFIG||{},URL=String(C.SUPABASE_URL||'').replace(/\/+$/,''),KEY=C.SUPABASE_ANON_KEY||'',form=document.getElementById('trackForm'),phone=document.getElementById('phone'),message=document.getElementById('message'),orders=document.getElementById('orders'),PHONE_KEY='kiteezi_track_phone_v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelStatus=s=>({pending:'Waiting for Confirmation',open:'Waiting for Confirmation',confirmed:'In Progress',completed:'Complete',cancelled:'Cancelled'}[String(s||'').toLowerCase()]||String(s||''));
const stationStatus=s=>({waiting:'Waiting','in_progress':'In Progress',complete:'Complete',cancelled:'Cancelled'}[String(s||'').toLowerCase()]||String(s||''));
async function rpc(name,body){const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=null}if(!r.ok)throw Error(d?.message||d?.error||'Request could not be completed.');return d;}
function render(rows){if(!rows.length){orders.innerHTML='<div class="empty">No website orders were found for this phone number.</div>';return;}orders.innerHTML=rows.map(r=>{const station=Array.isArray(r.station_progress)?r.station_progress:[],canCancel=['pending','open','confirmed'].includes(String(r.status||'').toLowerCase()),stationHtml=station.length?'<div class="station-list">'+station.map(s=>'<div class="station-row"><span>'+esc(s.station_name)+'</span><span class="status-pill">'+esc(stationStatus(s.status))+'</span></div>').join('')+'</div>':'<p class="muted">'+(String(r.status).toLowerCase()==='cancelled'?'—':'Waiting')+'</p>';return '<article class="order-card"><div class="order-head"><span class="order-id">#KD-'+esc(String(r.order_id).slice(0,8).toUpperCase())+'</span><span class="status-pill">'+esc(labelStatus(r.status))+'</span></div><div class="muted" style="margin-top:7px">'+esc(new Date(r.created_at).toLocaleString())+'</div>'+stationHtml+(canCancel?'<button class="btn cancel-btn" type="button" data-cancel="'+esc(r.order_id)+'">Cancel Order</button>':'')+'</article>';}).join('');}
async function track(){const value=phone.value.trim();if(!value)throw Error('Please enter your phone number.');localStorage.setItem(PHONE_KEY,value);message.hidden=true;orders.innerHTML='<div class="empty">Loading your orders…</div>';const data=await rpc('get_public_orders_by_phone',{p_phone:value});render(Array.isArray(data)?data:(data?[data]:[]));}
orders.addEventListener('click',async e=>{const btn=e.target.closest('[data-cancel]');if(!btn)return;if(!confirm('Cancel this order? This will not send a WhatsApp message.'))return;btn.disabled=true;btn.textContent='Cancelling…';try{await rpc('cancel_public_order',{p_order_id:btn.dataset.cancel,p_phone:phone.value.trim()});await track();}catch(err){message.hidden=false;message.className='notice error';message.textContent=err.message||'Order could not be cancelled.';btn.disabled=false;btn.textContent='Cancel Order';}});
form.addEventListener('submit',async e=>{e.preventDefault();try{await track();}catch(err){message.hidden=false;message.className='notice error';message.textContent=err.message||'Orders could not be loaded.';orders.innerHTML='';}});
const saved=localStorage.getItem(PHONE_KEY);if(saved){phone.value=saved;track().catch(()=>{});}
})();</script></body></html>
