<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Kiteezi Status</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container" style="max-width:720px"><div class="section-head"><div class="eyebrow">Kiteezi</div><h1>Status</h1><p>Check your booking or order without creating an account.</p></div><div class="form-card"><form id="statusForm" class="form"><label>Reference<input id="reference" required placeholder="Paste your reference"></label><label>Phone number<input id="phone" required placeholder="Phone used when submitting"></label><button class="btn btn-dark">Check status</button></form><div id="result" class="notice" hidden></div></div></div></main><script src="config.js"></script><script>(function(){'use strict';const C=window.KITEEZI_CONFIG||{},URL=String(C.SUPABASE_URL||'').replace(/\/+$/,''),KEY=C.SUPABASE_ANON_KEY||'',p=new URLSearchParams(location.search),type=p.get('type')==='booking'?'booking':'order',ref=document.getElementById('reference'),phone=document.getElementById('phone'),result=document.getElementById('result'),form=document.getElementById('statusForm');ref.value=p.get('id')||'';async function check(){const fn=type==='booking'?'get_public_booking_status':'get_public_order_status';const body=type==='booking'?{p_booking_id:ref.value,p_phone:phone.value}:{p_order_id:ref.value,p_phone:phone.value};const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=null}if(!r.ok)throw Error(d?.message||'Status could not be checked.');const row=Array.isArray(d)?d[0]:d;if(!row)throw Error('No matching submission was found. Check the reference and phone number.');result.hidden=false;result.textContent=row.status==='confirmed'?'Confirmed':row.status==='pending'?'Submitted — waiting for confirmation':row.status}form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=true;try{await check()}catch(e){result.hidden=false;result.textContent=e.message||'Status could not be checked.'}})})();</script></body></html>
