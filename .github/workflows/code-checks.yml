name: Code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-and-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name "*.js" -not -path "./node_modules/*" | sort)
          test -n "$files"
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done <<< "$files"

      - name: Check Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          files=$(find supabase/functions -type f -name "*.ts" | sort)
          test -n "$files"
          while IFS= read -r file; do
            echo "Checking $file"
            deno check "$file"
          done <<< "$files"

      - name: Check public client security invariants
        shell: bash
        run: |
          set -euo pipefail
          client_files=$(find . -type f \( -name "*.js" -o -name "*.html" \) \
            -not -path "./supabase/functions/*" \
            -not -path "./node_modules/*" | sort)
          if grep -nE "SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|service_role" $client_files; then
            echo "Server-only Supabase credentials must never appear in public client files."
            exit 1
          fi
          if grep -nE "element\.href[[:space:]]*=[[:space:]]*(value|row\.url|settings\.)" $client_files; then
            echo "CMS/database URLs must pass through an explicit URL allowlist before assignment."
            exit 1
          fi
          echo "Public client security invariants passed."

      - name: Check inline JavaScript and local HTML references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          root = Path(".").resolve()
          script_re = re.compile(r"<script(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script\s*>", re.I | re.S)
          tag_re = re.compile(r"<([A-Za-z][A-Za-z0-9-]*)\b([^>]*)>", re.I | re.S)
          ref_re = re.compile(r"""(?:src|href)\s*=\s*["']([^"']+)["']""", re.I)
          dynamic_ref_attr_re = re.compile(r"""\bdata-site-setting-href\s*=""", re.I)

          for html in sorted(root.rglob("*.html")):
              text = html.read_text(encoding="utf-8")
              for n, body in enumerate(script_re.findall(text), 1):
                  if not body.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                      f.write(body)
                      temp = Path(f.name)
                  try:
                      result = subprocess.run(["node", "--check", str(temp)], text=True, capture_output=True)
                      if result.returncode:
                          print(f"Inline JavaScript syntax error: {html} script #{n}")
                          print(result.stderr)
                          raise SystemExit(1)
                  finally:
                      temp.unlink(missing_ok=True)

              for tag, attrs in tag_re.findall(text):
                  for ref in ref_re.findall(attrs):
                      if dynamic_ref_attr_re.search(attrs):
                          continue
                      if ref.startswith(("#", "http://", "https://", "mailto:", "tel:", "data:", "javascript:")):
                          continue
                      clean_ref = ref.split("?", 1)[0].split("#", 1)[0]
                      if clean_ref.startswith("/kiteezi/"):
                          target = (root / clean_ref.removeprefix("/kiteezi/")).resolve()
                      elif clean_ref.startswith("/"):
                          target = (root / clean_ref.lstrip("/")).resolve()
                      else:
                          target = (html.parent / clean_ref).resolve()
                      if not target.exists():
                          print(f"Broken local reference: {html} -> {ref}")
                          raise SystemExit(1)

          print("HTML inline scripts and local references passed.")
          PY

      - name: Check admin startup DOM contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("admin/index.html").read_text(encoding="utf-8")
          js = Path("admin/admin.js").read_text(encoding="utf-8")
          ids = set(re.findall(r"\bid\s*=\s*[\"']([^\"']+)[\"']", html, re.I))
          marker = "// admin-login.js owns the login submit handler."
          if marker not in js:
              raise SystemExit("Admin startup binding marker is missing.")
          block = js.split(marker, 1)[1]
          block = block.split("setupPos();restore();", 1)[0]
          refs = set(re.findall(r"\$\(['\"]#([A-Za-z][\w-]*)['\"]\)\.(?:onclick|oninput|onchange|onsubmit|addEventListener)", block))
          # countForm is created dynamically when the stock-count modal opens.
          dynamic_ids = {"countForm"}
          missing = sorted(x for x in refs if x not in ids and x not in dynamic_ids)
          if missing:
              print("Admin startup references missing DOM ids:", ", ".join(missing))
              raise SystemExit(1)
          print(f"Admin startup DOM contract passed: {len(refs)} bound ids verified.")
          PY
