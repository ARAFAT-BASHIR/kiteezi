name: Code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all JavaScript files
        shell: bash
        run: |
          set -e
          files=$(find . -type f -name "*.js" -not -path "./node_modules/*" | sort)
          test -n "$files"
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done <<< "$files"
