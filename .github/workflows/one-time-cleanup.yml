name: One-time Kiteezi cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor == 'ARAFAT-BASHIR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/admin.js')
          s=p.read_text()
          marker="const low=rows0.filter(x=>Number(stock[x.id]||0)<=Number(x.reorder_level||0));"
          start=s.find(marker)
          if start < 0:
              raise SystemExit('Inventory renderer marker not found')
          pos=s.find("rows.map(x=>", start)
          if pos < 0:
              raise SystemExit('Broken inventory rows.map not found')
          s=s[:pos]+"rows0.map(x=>"+s[pos+len("rows.map(x=>"):]
          p.write_text(s)
          PY
      - name: Verify JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=list(Path('.').glob('*.html'))+list(Path('admin').glob('*.html'))
          js=list(Path('.').glob('*.js'))+list(Path('admin').glob('*.js'))
          for f in html:
              text=f.read_text(errors='ignore')
              if '<html' not in text.lower(): raise SystemExit(f'{f}: missing <html>')
              if '</html>' not in text.lower(): raise SystemExit(f'{f}: missing </html>')
              ids=re.findall(r'\bid=["\']([^"\']+)',text,re.I)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: raise SystemExit(f'{f}: duplicate ids: {dup}')
          for f in js:
              if '\x00' in f.read_text(errors='ignore'): raise SystemExit(f'{f}: NUL byte')
          print(f'Checked {len(html)} HTML files and {len(js)} JS files')
          PY
      - name: Commit and push cleanup
        run: |
          git config user.name 'Kiteezi Cleanup Bot'
          git config user.email 'arafatbashir256@gmail.com'
          git add admin/admin.js
          git commit -m 'Fix admin inventory renderer and verify project structure' || exit 0
          git push origin HEAD:main
