<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Swimming Availability | Kiteezi Recreational Center"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="nav"><div class="container navin"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><span class="brand-name">Kiteezi Recreational Center</span><small>Comfort • Dining • Recreation</small></span></a><nav class="links"><a href="index.html">Home</a><a href="swimming.html">Swimming</a><a href="sports.html">Sports</a><a href="menu.html">Menu</a><a href="events.html">Events</a><a href="contact.html">Contact</a></nav></div></header>
<main><section class="hero"><div class="container hero-content"><div class="eyebrow">School swimming</div><h1>Check occupied swimming periods</h1><p>School swimming sessions are one hour. Check the periods already occupied before requesting your session.</p></div></section>
<section class="section"><div class="container"><div class="panel" style="padding:22px;margin-bottom:24px"><h2>Choose your school swimming date</h2><label for="schoolDate">Date</label><input id="schoolDate" type="date" required><div id="dayAvailability" class="state">Choose a date to see available sessions.</div><label for="schoolSlot">Available one-hour session</label><select id="schoolSlot" disabled><option value="">Choose an available time</option></select><button id="continueSchoolBooking" class="btn btn-primary" type="button" disabled>Continue to booking</button></div><h2>Weekly school timetable</h2><p>Only occupied periods are shown. School names are kept private.</p><div id="timetable" class="grid grid-3"><div class="state">Loading current timetable…</div></div><div class="actions" style="margin-top:28px"><a class="btn btn-dark" href="inquiry.html?type=swimming">Ask a question</a></div></div></section></main>
<footer class="footer"><div class="container copyright">© <span data-year></span> Kiteezi Recreational Center.</div></footer>
<script src="config.js"></script><script src="site.js"></script>
<script>
(async()=>{
const el=document.getElementById('timetable'),dateEl=document.getElementById('schoolDate'),slotEl=document.getElementById('schoolSlot'),dayEl=document.getElementById('dayAvailability'),go=document.getElementById('continueSchoolBooking'),C=window.KITEEZI_CONFIG||{},U=String(C.SUPABASE_URL||'').replace(/\/+$/,''),K=String(C.SUPABASE_ANON_KEY||''),days=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let rows=[];
const pad=n=>String(n).padStart(2,'0'),fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60),display=m=>{let h=Math.floor(m/60);return (h%12||12)+(m%60?':'+pad(m%60):'')+(h<12?'am':'pm')};
const now=new Date();dateEl.min=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);dateEl.value=dateEl.min;
try{const r=await fetch(U+'/rest/v1/swimming_timetable?select=day_of_week,start_time,end_time&active=eq.true&order=day_of_week.asc,start_time.asc',{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());rows=await r.json();const grouped=days.slice(1).map((d,i)=>({d,rows:rows.filter(x=>x.day_of_week===i+1)})).filter(x=>x.rows.length);el.innerHTML=grouped.map(g=>'<article class="card"><div class="card-body"><span class="badge">'+g.d+'</span><h3>Occupied periods</h3><ul class="list">'+g.rows.map(x=>'<li><strong>'+String(x.start_time).slice(0,5)+'–'+String(x.end_time).slice(0,5)+'</strong> — Occupied</li>').join('')+'</ul></div></article>').join('')||'<div class="state">No occupied periods listed.</div>';}catch(e){el.innerHTML='<div class="status show error">Unable to load timetable. Refresh and try again.</div>';console.error(e);return}
function update(){if(!dateEl.value)return;const day=new Date(dateEl.value+'T12:00:00').getDay()||7,occ=rows.filter(x=>x.day_of_week===day).map(x=>({s:+String(x.start_time).slice(0,2)*60 + +String(x.start_time).slice(3,5),e:+String(x.end_time).slice(0,2)*60 + +String(x.end_time).slice(3,5)})),free=[];if(day<=5)for(let t=540;t<960;t+=60)if(!occ.some(o=>t<o.e&&t+60>o.s))free.push(t);dayEl.innerHTML='<strong>'+days[day]+'</strong><p>'+(day>5?'School swimming sessions are scheduled Monday to Friday. Please choose a weekday.':(occ.length?occ.map(o=>display(o.s)+'–'+display(o.e)+' — Occupied').join('<br>'):'No school-occupied periods listed.'))+'</p><p>'+free.length+' available one-hour sessions.</p>';slotEl.innerHTML='<option value="">Choose an available time</option>'+free.map(t=>'<option value="'+fmt(t)+'">'+display(t)+' – '+display(t+60)+'</option>').join('');slotEl.disabled=!free.length;go.disabled=true;}
dateEl.addEventListener('change',update);slotEl.addEventListener('change',()=>go.disabled=!slotEl.value);go.addEventListener('click',()=>{if(dateEl.value&&slotEl.value)location.href='booking.html?service=school-swimming&date='+encodeURIComponent(dateEl.value)+'&time='+encodeURIComponent(slotEl.value)});update();
})();
</script></body></html>
