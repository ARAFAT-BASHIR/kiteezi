<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Swimming Availability | Kiteezi Recreational Center"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="nav"><div class="container navin"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><span class="brand-name">Kiteezi Recreational Center</span><small>Comfort • Dining • Recreation</small></span></a><nav class="links"><a href="index.html">Home</a><a href="swimming.html">Swimming</a><a href="sports.html">Sports</a><a href="menu.html">Menu</a><a href="events.html">Events</a><a href="contact.html">Contact</a></nav></div></header>
<main><section class="hero"><div class="container hero-content"><div class="eyebrow">School swimming</div><h1>Check occupied swimming periods</h1><p>School swimming sessions are one hour. Check the periods already occupied before requesting your session.</p></div></section>
<section class="section"><div class="container"><div id="timetable" class="grid grid-3"><div class="state">Loading current timetable…</div></div><div class="actions" style="margin-top:28px"><a class="btn btn-primary" href="booking.html?service=school-swimming">Request a school swimming session</a><a class="btn btn-dark" href="inquiry.html?type=swimming">Ask a question</a></div></div></section></main>
<footer class="footer"><div class="container copyright">© <span data-year></span> Kiteezi Recreational Center.</div></footer>
<script src="config.js"></script><script src="site.js"></script>
<script>
(async()=>{const el=document.getElementById('timetable'),C=window.KITEEZI_CONFIG||{},U=String(C.SUPABASE_URL||'').replace(/\/+$/,''),K=String(C.SUPABASE_ANON_KEY||'');const days=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];try{const r=await fetch(U+'/rest/v1/swimming_timetable?select=day_of_week,start_time,end_time&active=eq.true&order=day_of_week.asc,start_time.asc',{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error('Unable to load timetable');const rows=await r.json();const grouped=days.slice(1).map((d,i)=>({d,rows:rows.filter(x=>x.day_of_week===i+1)})).filter(x=>x.rows.length);el.innerHTML=grouped.map(g=>'<article class="card"><div class="card-body"><span class="badge">'+g.d+'</span><h3>Occupied periods</h3><ul class="list">'+g.rows.map(x=>'<li><strong>'+String(x.start_time).slice(0,5)+'–'+String(x.end_time).slice(0,5)+'</strong> — Occupied</li>').join('')+'</ul></div></article>').join('')||'<div class="state">No school-occupied periods are currently listed.</div>'}catch(e){el.innerHTML='<div class="status show error">Unable to load the current swimming timetable. Please try again.</div>'}})();
</script></body></html>
