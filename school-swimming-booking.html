<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Swimming Booking | Kiteezi Recreational Center</title><link rel="stylesheet" href="styles.css">

(function(){const q=new URLSearchParams(location.search),day=Number(q.get('day')),time=q.get('time'),days=['','Monday','Tuesday','Wednesday','Thursday','Friday'];const U=String((window.KITEEZI_CONFIG||{}).SUPABASE_URL||'').replace(/\/+$/,''),K=(window.KITEEZI_CONFIG||{}).SUPABASE_ANON_KEY||'';const period=document.getElementById('selectedPeriod'),form=document.getElementById('schoolForm'),status=document.getElementById('status'),submit=document.getElementById('submit');
function humanSchoolError(error,fallback='We could not submit the school swimming request right now. Please try again in a moment.'){const m=String(error?.message??error??'').trim();if(!m||m==='[object Object]')return fallback;if(/(?:supabase|postgrest|pgrst|postgres|sql|schema|relation|column|constraint|permission denied|function .* does not exist|does not exist|http\s*\d{3}|\b(?:3f000|42883|42501|235\d{3})\b|fetch failed|network error|unexpected .* response|syntax error|jwt)/i.test(m)||/^\s*[\[{].*[\]}]\s*$/.test(m))return fallback;return m;}function fmt(t){const [h,m]=t.split(':').map(Number),e=(h+1)%24;return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')+' – '+(e%12||12)+':'+String(m).padStart(2,'0')+(e<12?' AM':' PM')}if(!(day>=1&&day<=5&&/^([01]\d|2[0-3]):00$/.test(time||''))){period.textContent='Please return to School Swimming availability and choose a weekday and time.';submit.disabled=true}else period.textContent=days[day]+' • '+fmt(time);form.addEventListener('submit',async e=>{e.preventDefault();if(!form.checkValidity())return form.reportValidity();submit.disabled=true;submit.textContent='Submitting…';status.className='status';try{const f=new FormData(form),r=await fetch(U+'/rest/v1/rpc/submit_school_swimming_booking',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_customer_name:f.get('name'),p_phone:f.get('phone'),p_email:f.get('email')||null,p_day_of_week:day,p_start_time:time,p_people:Number(f.get('people')),p_notes:f.get('notes')||null})}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(humanSchoolError(d?.message||d?.error||d));status.innerHTML='School swimming request submitted — wait for confirmation.<br><a href="tracking.html?type=booking&id='+encodeURIComponent(d.booking_id)+'">Check booking status</a>';status.className='status show success';form.reset()}catch(err){status.textContent=humanSchoolError(err);status.className='status show error'}finally{submit.disabled=false;submit.textContent='Submit School Swimming Request'}})})();
</script></body></html>
